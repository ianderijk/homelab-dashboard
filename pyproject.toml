[project]
name = "homelab-dashboard"
version = "0.1.0"
description = "Dashboard for homelab services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "api",
    "service",
]

[tool.uv.workspace]
members = ["api", "service", "utils"]

[tool.uv.sources]
api = { workspace = true }
service = { workspace = true }
utils = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty",
]
