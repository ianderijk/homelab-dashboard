[project]
name = "homelab-dashboard"
version = "0.1.0"
description = "Dashboard for homelab services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "requests>=2.34.2",
]

[tool.uv.workspace]
members = ["api", "service", "utils"]

[tool.uv.sources]
utils = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
