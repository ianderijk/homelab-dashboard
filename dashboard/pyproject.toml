[project]
name = "dashboard"
version = "0.1.0"
description = "Web frontend for the homelab dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
dashboard = "dashboard:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 100
